apiVersion: v1
kind: Secret
metadata:
  name: sms-secrets
  namespace: school-management
type: Opaque
stringData:
  DATABASE_URL: "postgresql://sms_user:${DB_PASSWORD}@postgres.school-management.svc.cluster.local:5432/school_management"
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis.school-management.svc.cluster.local:6379"
  JWT_SECRET: "${JWT_SECRET}"
  DB_PASSWORD: "${DB_PASSWORD}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
---
apiVersion: v1
kind: Secret
metadata:
  name: sms-docker-credentials
  namespace: school-management
type: docker-registry
data:
  .dockerconfigjson: $(echo -n '{"auths":{"${ECR_REGISTRY}":{"username":"AWS","password":"$(aws ecr get-authorization-token --query authorizationData[0].authorizationToken --output text)"}}}' | base64 -w 0)
