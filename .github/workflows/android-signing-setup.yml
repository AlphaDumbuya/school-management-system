name: Android Signing Setup (one-time)

# Run this ONCE, manually, to bootstrap native passkeys on Android.
#
# It generates a RELEASE keystore and prints everything you need:
#   1. ANDROID_KEYSTORE_BASE64  → save as a GitHub Actions SECRET
#   2. The keystore/key passwords + alias you entered (echoed for your records)
#   3. SHA-256 cert fingerprint  → put in frontend/public/.well-known/assetlinks.json
#   4. android:apk-key-hash origin → set as Vercel env WEBAUTHN_ANDROID_ORIGIN
#
# After running:
#   - Add secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#     ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   - Update assetlinks.json with the SHA-256 fingerprint and commit/deploy
#   - Set WEBAUTHN_ANDROID_ORIGIN in Vercel
#   - Re-run "Build Android APK" (it will now produce a release-signed APK)
#
# SECURITY: the base64 keystore is printed to the (private) Actions log. Treat
# that log as sensitive; delete the run after copying the values into secrets.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias (e.g. wiskul)'
        required: true
        default: 'wiskul'
      store_password:
        description: 'Keystore password (min 6 chars)'
        required: true
      key_password:
        description: 'Key password (min 6 chars)'
        required: true

jobs:
  generate:
    name: Generate release keystore + fingerprints
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=WiSkul, OU=Mobile, O=WiSkul, L=Freetown, S=Western Area, C=SL"

      - name: Print base64 keystore (→ secret ANDROID_KEYSTORE_BASE64)
        run: |
          echo "=================== ANDROID_KEYSTORE_BASE64 ==================="
          base64 -w0 release.keystore
          echo ""
          echo "=============================================================="

      - name: Print SHA-256 fingerprint + apk-key-hash origin
        run: |
          echo "Extracting certificate fingerprint..."
          # Colon-separated hex SHA-256 → goes into assetlinks.json
          SHA256_HEX=$(keytool -list -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.key_alias }}" \
            -storepass "${{ github.event.inputs.store_password }}" \
            | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ' ')

          echo ""
          echo "======= assetlinks.json  sha256_cert_fingerprints ======="
          echo "$SHA256_HEX"
          echo "=========================================================="

          # android:apk-key-hash origin = base64url of the RAW sha256 bytes.
          # Export the cert, hash it, base64url-encode → WEBAUTHN_ANDROID_ORIGIN.
          keytool -exportcert \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.key_alias }}" \
            -storepass "${{ github.event.inputs.store_password }}" \
            -file cert.der >/dev/null 2>&1
          B64URL=$(openssl dgst -sha256 -binary cert.der | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          echo ""
          echo "======= Vercel env  WEBAUTHN_ANDROID_ORIGIN ======="
          echo "android:apk-key-hash:$B64URL"
          echo "==================================================="
