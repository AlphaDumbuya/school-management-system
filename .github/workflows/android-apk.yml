name: Build Android APK

# Builds a downloadable Android APK in the cloud — no local Android tooling needed.
# Trigger it manually from the Actions tab (or it runs when Android/frontend
# sources change on the branch). The APK is uploaded as a build artifact and,
# for manual runs, attached to a GitHub Release for a permanent download URL.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to publish the APK (e.g. v1.0.0). Leave blank to only produce an artifact.'
        required: false
        default: ''
  push:
    branches: [feature/sl-report-cards, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write   # needed to publish the APK to a GitHub Release

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java (JDK 21 — required by Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & install packages (API 36 — Capacitor 8)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
        working-directory: frontend

      - name: Build web app (offline-first app variant)
        run: npm run build:app
        working-directory: frontend
        env:
          # Production API the packaged app talks to. Override in repo Variables
          # (Settings → Secrets and variables → Actions → Variables) as VITE_API_URL.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://www.wiskulsl.com' }}

      - name: Capacitor sync (copy web assets into android/)
        run: npx cap sync android
        working-directory: frontend

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: frontend/android

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: frontend/android

      - name: Rename APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk-out/wiskul.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiskul-apk
          path: apk-out/wiskul.apk
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      # Publish the APK to a GitHub Release so you get a PERMANENT download URL.
      # Manual runs: uses the tag you enter. Push runs: uses a rolling "android-latest" tag.
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || 'android-latest' }}
          name: WiSkul Android APK
          body: 'Latest WiSkul Android app (debug-signed). Direct download — enable "install from unknown sources" if prompted.'
          files: apk-out/wiskul.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
