name: Build Android APK

# Builds a downloadable Android APK in the cloud — no local Android tooling needed.
# Trigger it manually from the Actions tab (or it runs when Android/frontend
# sources change on the branch). The APK is uploaded as a build artifact and,
# for manual runs, attached to a GitHub Release for a permanent download URL.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to publish the APK (e.g. v1.0.0). Leave blank to only produce an artifact.'
        required: false
        default: ''
  push:
    branches: [feature/sl-report-cards, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write   # needed to publish the APK to a GitHub Release

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    # Don't re-trigger on the workflow's own auto-publish commit (prevents a loop).
    if: "!contains(github.event.head_commit.message, 'auto-publish latest APK')"
    env:
      # Surfaced so the Blob step's `if:` can check whether the token is set.
      HAS_BLOB_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN != '' }}
      # When a release keystore is configured we build a RELEASE-signed APK with
      # a STABLE signing certificate — required for native Android passkeys
      # (the cert fingerprint must match /.well-known/assetlinks.json). Without
      # these secrets we fall back to a debug-signed APK (passkeys won't verify).
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java (JDK 21 — required by Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & install packages (API 36 — Capacitor 8)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
        working-directory: frontend

      - name: Build web app (offline-first app variant)
        run: npm run build:app
        working-directory: frontend
        env:
          # Production API the packaged app talks to. Override in repo Variables
          # (Settings → Secrets and variables → Actions → Variables) as VITE_API_URL.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://www.wiskulsl.com' }}

      - name: Capacitor sync (copy web assets into android/)
        run: npx cap sync android
        working-directory: frontend

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: frontend/android

      # ── Release signing (only when a keystore secret is configured) ─────────
      # Decode the base64 keystore and wire gradle signing props so the release
      # build is signed with a STABLE cert (fingerprint must match assetlinks.json).
      - name: Decode release keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/frontend/android/app/release.keystore"
        working-directory: .

      - name: Build RELEASE APK (signed)
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/frontend/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
        working-directory: frontend/android

      - name: Build DEBUG APK (fallback — no release keystore configured)
        if: env.HAS_RELEASE_KEYSTORE != 'true'
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: frontend/android

      - name: Rename APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          if [ "$HAS_RELEASE_KEYSTORE" = "true" ]; then
            SRC=frontend/android/app/build/outputs/apk/release/app-release.apk
          else
            SRC=frontend/android/app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$SRC" "$GITHUB_WORKSPACE/apk-out/wiskul.apk"
          # Print the signing cert SHA-256 (handy for assetlinks.json).
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$GITHUB_WORKSPACE/apk-out/wiskul.apk" | grep -i "SHA-256" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiskul-apk
          path: apk-out/wiskul.apk
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      # Publish the APK to a GitHub Release (permanent URL for internal/manual use).
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || 'android-latest' }}
          name: WiSkul Android APK
          body: 'Latest WiSkul Android app (debug-signed). Direct download — enable "install from unknown sources" if prompted.'
          files: apk-out/wiskul.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # PUBLISHING (Vercel Blob — fully public, no token proxy):
      # Upload the built APK to Vercel Blob at a STABLE key (wiskul.apk). Blob
      # returns a public HTTPS URL that never bloats git and has no 100 MB limit.
      # The backend's /api/v1/app/download reads this URL (from the app_settings
      # 'apk_blob_url' row we write here) so downloads are still counted and the
      # public URL stays consistent.
      #
      # Requires repo secret BLOB_READ_WRITE_TOKEN (Vercel → Storage → Blob →
      # tokens). If the secret is absent, this step is skipped and the GitHub
      # Release (published above) remains the source the backend proxies.
      - name: Publish APK to Vercel Blob
        if: env.HAS_BLOB_TOKEN == 'true'
        env:
          BLOB_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          # Backend base + a shared secret to persist the resulting Blob URL.
          APK_URL_WEBHOOK: ${{ vars.APK_URL_WEBHOOK || 'https://www.wiskulsl.com/api/v1/app/blob-url' }}
          APK_URL_WEBHOOK_SECRET: ${{ secrets.APK_URL_WEBHOOK_SECRET }}
        run: |
          set -e
          npm install @vercel/blob@^0.27.0 --no-save
          node - <<'EOF'
          const fs = require('fs');
          const { put } = require('@vercel/blob');
          (async () => {
            const data = fs.readFileSync('apk-out/wiskul.apk');
            const res = await put('wiskul.apk', data, {
              access: 'public',
              addRandomSuffix: false,               // stable, overwritable key
              allowOverwrite: true,
              contentType: 'application/vnd.android.package-archive',
              token: process.env.BLOB_TOKEN,
            });
            console.log('Blob URL:', res.url);
            // Tell the backend the new public URL (best-effort).
            const hook = process.env.APK_URL_WEBHOOK;
            const secret = process.env.APK_URL_WEBHOOK_SECRET;
            if (hook && secret) {
              try {
                const r = await fetch(hook, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'x-apk-secret': secret },
                  body: JSON.stringify({ url: res.url }),
                });
                console.log('Webhook status:', r.status);
              } catch (e) { console.warn('Webhook failed:', e.message); }
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          EOF
