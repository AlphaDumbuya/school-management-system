apply plugin: 'com.android.application'

// Release signing — credentials come from EITHER a gitignored keystore.properties
// file (local dev, see keystore.properties.example) OR environment variables
// (CI: exported from GitHub secrets). Env vars take precedence so cloud builds
// sign with the stable release cert without needing a committed file.
//   ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// Resolve signing inputs from env first, then the properties file.
def signingStoreFile = System.getenv("ANDROID_KEYSTORE_FILE") ?: keystoreProps['storeFile']
def signingStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: keystoreProps['storePassword']
def signingKeyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: keystoreProps['keyAlias']
def signingKeyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: keystoreProps['keyPassword']
// True only when we actually have a keystore to sign with.
def hasReleaseSigning = signingStoreFile != null && file(signingStoreFile).exists()

// Auto-incrementing version so every CI build is a strictly-newer upgrade.
// In GitHub Actions we pass APP_VERSION_CODE (the run number) and
// APP_VERSION_NAME; Android then treats the newest APK as an in-place update
// over whatever is installed — the user installs ONCE and jumps to the latest
// (all features included), instead of installing each build one by one.
// Falls back to 1 / "1.0" for local builds where the env vars aren't set.
def computedVersionCode = (System.getenv("APP_VERSION_CODE") ?: "1").toInteger()
def computedVersionName = System.getenv("APP_VERSION_NAME") ?: "1.0"

android {
    namespace = "sl.wiskul.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "sl.wiskul.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName computedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Sign the release only when a keystore is configured (file or env).
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
