<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350">
  <!-- Isometric base -->
  <path d="M200 300 L340 230 L200 160 L60 230 Z" fill="#16213e" stroke="#7c3aed" stroke-width="0.8" opacity="0.6"/>
  <path d="M60 230 L60 255 L200 325 L200 300 Z" fill="#0f1629" stroke="#7c3aed" stroke-width="0.3"/>
  <path d="M200 300 L200 325 L340 255 L340 230 Z" fill="#1a1a2e" stroke="#7c3aed" stroke-width="0.3"/>
  
  <!-- Large central lock -->
  <rect x="160" y="175" width="80" height="65" rx="8" fill="#16213e" stroke="#00d4aa" stroke-width="2"/>
  <path d="M180 175 L180 155 Q180 135 200 135 Q220 135 220 155 L220 175" fill="none" stroke="#00d4aa" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="207" r="10" fill="none" stroke="#00d4aa" stroke-width="2"/>
  <rect x="197" y="210" width="6" height="14" rx="3" fill="#00d4aa"/>
  
  <!-- Orbiting data packets -->
  <g>
    <circle cx="200" cy="200" r="90" fill="none" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="4 6" opacity="0.4"/>
    <circle cx="115" cy="175" r="12" fill="#16213e" stroke="#7c3aed" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" values="0 200 200;360 200 200" dur="12s" repeatCount="indefinite"/>
    </circle>
    <text x="115" y="179" font-size="10" text-anchor="middle" fill="#7c3aed">
      <animateTransform attributeName="transform" type="rotate" values="0 200 200;360 200 200" dur="12s" repeatCount="indefinite"/>
      📄
    </text>
  </g>
  
  <g>
    <circle cx="200" cy="200" r="120" fill="none" stroke="#00d4aa" stroke-width="0.5" stroke-dasharray="3 8" opacity="0.3"/>
    <circle cx="85" cy="220" r="12" fill="#16213e" stroke="#00d4aa" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" values="0 200 200;-360 200 200" dur="15s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- User icons around -->
  <g opacity="0.8">
    <circle cx="90" cy="120" r="16" fill="#16213e" stroke="#00d4aa" stroke-width="1"/>
    <text x="90" y="125" font-size="14" text-anchor="middle">🎓</text>
    <animate attributeName="transform" values="translate(0,0);translate(0,-4);translate(0,0)" dur="3s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.8">
    <circle cx="310" cy="110" r="16" fill="#16213e" stroke="#7c3aed" stroke-width="1"/>
    <text x="310" y="115" font-size="14" text-anchor="middle">👨‍🏫</text>
    <animate attributeName="transform" values="translate(0,0);translate(0,-3);translate(0,0)" dur="3.5s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.8">
    <circle cx="340" cy="180" r="14" fill="#16213e" stroke="#00d4aa" stroke-width="1"/>
    <text x="340" y="185" font-size="12" text-anchor="middle">💰</text>
    <animate attributeName="transform" values="translate(0,0);translate(0,-3);translate(0,0)" dur="4s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.8">
    <circle cx="70" cy="270" r="14" fill="#16213e" stroke="#7c3aed" stroke-width="1"/>
    <text x="70" y="275" font-size="12" text-anchor="middle">👑</text>
    <animate attributeName="transform" values="translate(0,0);translate(0,-3);translate(0,0)" dur="2.8s" repeatCount="indefinite"/>
  </g>
  
  <!-- Connection lines -->
  <line x1="105" y1="130" x2="165" y2="185" stroke="#00d4aa" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="295" y1="120" x2="235" y2="180" stroke="#7c3aed" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur="2.5s" repeatCount="indefinite"/>
  </line>
  <line x1="328" y1="185" x2="240" y2="200" stroke="#00d4aa" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur="1.8s" repeatCount="indefinite"/>
  </line>
  <line x1="82" y1="260" x2="162" y2="225" stroke="#7c3aed" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur="2.2s" repeatCount="indefinite"/>
  </line>
  
  <!-- Scanning line effect -->
  <rect x="60" y="160" width="280" height="1" fill="#00d4aa" opacity="0.15">
    <animate attributeName="y" values="100;300;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.3;0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
