<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380">
  <!-- Dashboard frame -->
  <rect x="50" y="40" width="400" height="280" rx="12" fill="#16213e" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="50" y="40" width="400" height="35" rx="12" fill="#0f1629"/>
  <rect x="50" y="63" width="400" height="12" fill="#0f1629"/>
  <!-- Window dots -->
  <circle cx="72" cy="57" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="88" cy="57" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="104" cy="57" r="5" fill="#10b981" opacity="0.8"/>
  
  <!-- Left sidebar -->
  <rect x="55" y="80" width="90" height="235" fill="#0f1629" opacity="0.5"/>
  <rect x="65" y="95" width="70" height="8" rx="4" fill="#7c3aed" opacity="0.4"/>
  <rect x="65" y="112" width="55" height="6" rx="3" fill="#ffffff" opacity="0.1"/>
  <rect x="65" y="126" width="60" height="6" rx="3" fill="#ffffff" opacity="0.1"/>
  <rect x="65" y="140" width="45" height="6" rx="3" fill="#00d4aa" opacity="0.3"/>
  <rect x="65" y="154" width="55" height="6" rx="3" fill="#ffffff" opacity="0.1"/>
  <rect x="65" y="168" width="50" height="6" rx="3" fill="#ffffff" opacity="0.1"/>
  <rect x="65" y="182" width="60" height="6" rx="3" fill="#ffffff" opacity="0.1"/>
  
  <!-- Main content area - KPI cards -->
  <rect x="155" y="85" width="85" height="50" rx="6" fill="#1a1a2e" stroke="#00d4aa" stroke-width="0.5"/>
  <text x="165" y="103" font-size="7" fill="#9ca3af">Students</text>
  <text x="165" y="122" font-size="14" font-weight="bold" fill="#00d4aa">1,247</text>
  
  <rect x="250" y="85" width="85" height="50" rx="6" fill="#1a1a2e" stroke="#7c3aed" stroke-width="0.5"/>
  <text x="260" y="103" font-size="7" fill="#9ca3af">Teachers</text>
  <text x="260" y="122" font-size="14" font-weight="bold" fill="#7c3aed">86</text>
  
  <rect x="345" y="85" width="95" height="50" rx="6" fill="#1a1a2e" stroke="#00d4aa" stroke-width="0.5"/>
  <text x="355" y="103" font-size="7" fill="#9ca3af">Attendance</text>
  <text x="355" y="122" font-size="14" font-weight="bold" fill="#00d4aa">94.2%</text>
  
  <!-- Chart area -->
  <rect x="155" y="145" width="175" height="120" rx="6" fill="#1a1a2e" stroke="#ffffff" stroke-width="0.3" opacity="0.5"/>
  <!-- Chart grid lines -->
  <line x1="170" y1="170" x2="315" y2="170" stroke="#ffffff" stroke-width="0.2" opacity="0.2"/>
  <line x1="170" y1="195" x2="315" y2="195" stroke="#ffffff" stroke-width="0.2" opacity="0.2"/>
  <line x1="170" y1="220" x2="315" y2="220" stroke="#ffffff" stroke-width="0.2" opacity="0.2"/>
  <line x1="170" y1="245" x2="315" y2="245" stroke="#ffffff" stroke-width="0.2" opacity="0.2"/>
  <!-- Area chart -->
  <path d="M170 240 L185 225 L200 230 L215 210 L230 215 L245 195 L260 200 L275 180 L290 175 L305 165 L315 160 L315 250 L170 250 Z" fill="url(#chartGrad)" opacity="0.3"/>
  <path d="M170 240 L185 225 L200 230 L215 210 L230 215 L245 195 L260 200 L275 180 L290 175 L305 165 L315 160" fill="none" stroke="#00d4aa" stroke-width="2" stroke-linecap="round"/>
  <!-- Data points -->
  <circle cx="215" cy="210" r="3" fill="#00d4aa"/>
  <circle cx="260" cy="200" r="3" fill="#00d4aa"/>
  <circle cx="305" cy="165" r="3" fill="#00d4aa"/>
  
  <!-- Right panel - Pie chart -->
  <rect x="340" y="145" width="100" height="120" rx="6" fill="#1a1a2e" stroke="#ffffff" stroke-width="0.3" opacity="0.5"/>
  <circle cx="390" cy="200" r="30" fill="none" stroke="#7c3aed" stroke-width="8" stroke-dasharray="60 130" transform="rotate(-90 390 200)"/>
  <circle cx="390" cy="200" r="30" fill="none" stroke="#00d4aa" stroke-width="8" stroke-dasharray="45 145" stroke-dashoffset="-60" transform="rotate(-90 390 200)"/>
  <circle cx="390" cy="200" r="30" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="25 165" stroke-dashoffset="-105" transform="rotate(-90 390 200)"/>
  <text x="380" y="204" font-size="9" font-weight="bold" fill="white">72%</text>
  <text x="355" y="245" font-size="6" fill="#9ca3af">Pass Rate</text>
  
  <!-- Bottom table area -->
  <rect x="155" y="275" width="285" height="35" rx="4" fill="#0f1629" opacity="0.5"/>
  <rect x="165" y="282" width="80" height="5" rx="2" fill="#ffffff" opacity="0.15"/>
  <rect x="260" y="282" width="50" height="5" rx="2" fill="#00d4aa" opacity="0.3"/>
  <rect x="325" y="282" width="40" height="5" rx="2" fill="#7c3aed" opacity="0.3"/>
  <rect x="380" y="282" width="45" height="5" rx="2" fill="#ffffff" opacity="0.1"/>
  <rect x="165" y="295" width="65" height="5" rx="2" fill="#ffffff" opacity="0.1"/>
  <rect x="260" y="295" width="55" height="5" rx="2" fill="#00d4aa" opacity="0.2"/>
  <rect x="325" y="295" width="35" height="5" rx="2" fill="#7c3aed" opacity="0.2"/>
  <rect x="380" y="295" width="40" height="5" rx="2" fill="#ffffff" opacity="0.1"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Floating notification -->
  <g>
    <rect x="360" y="25" width="100" height="30" rx="6" fill="#16213e" stroke="#00d4aa" stroke-width="0.8"/>
    <circle cx="375" cy="40" r="6" fill="#00d4aa" opacity="0.2"/>
    <text x="375" y="43" font-size="8" fill="#00d4aa" text-anchor="middle">✓</text>
    <text x="387" y="38" font-size="6" fill="#9ca3af">New Student</text>
    <text x="387" y="48" font-size="6" fill="#00d4aa">Enrolled</text>
    <animate attributeName="transform" values="translate(0,0);translate(0,-3);translate(0,0)" dur="3s" repeatCount="indefinite"/>
  </g>
</svg>
